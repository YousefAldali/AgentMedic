# Dashboard theme: dark navy, flat surfaces, one accent colour (teal).
[theme]
base = "dark"
primaryColor = "#2dd4bf"
backgroundColor = "#0f1626"
secondaryBackgroundColor = "#161f33"
textColor = "#e2e8f0"
font = "sans serif"

[client]
toolbarMode = "minimal"

[server]
headless = true
address = "127.0.0.1"   # the dashboard can start failures and approve fixes, so only this computer may open it

[browser]
gatherUsageStats = false
