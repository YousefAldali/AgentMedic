<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  canvas { width: 100%; max-width: 1100px; height: auto; aspect-ratio: 1100 / 540; display: block;
           margin: 0 auto; border-radius: 16px; }
</style>
</head>
<body>
<canvas id="office" width="1100" height="540"></canvas>
<script>
// Live office v2. Every agent sits at a glass desk, the shared systems sit below, data
// flows through pipes from each system to the agents that use it, and the doctor walks
// along the corridor to whatever it is examining. All state comes from the running
// system through the status feed; nothing here is scripted.
const API = "__API__";
const LOGO = "__LOGO__";
const W = 1100, H = 540, CORRIDOR = 292;
const cv = document.getElementById("office");
const ctx = cv.getContext("2d");
// Draw at the screen's real pixel density so it stays sharp at any size; the canvas
// scales with the window through CSS and keeps its shape.
const DPR = Math.min(2, window.devicePixelRatio || 1);
cv.width = W * DPR; cv.height = H * DPR;
ctx.scale(DPR, DPR);
// The scene is usually shown smaller than its 1100 px design width, so text and icons
// are drawn larger to stay readable (also on a projector).
const FONT = 1.3, ICON = 1.15;

const DESKS = { hr: [140, 150], procurement: [370, 150], finance: [600, 150], support: [830, 150] };
const SYSTEMS = { hr_db: [140, 440], vendor_api: [370, 440], knowledge_base: [600, 440], llm: [830, 440] };
const HOME = [1025, 330];
const AGENT = {
  hr: ["HR", "Leave & policies"], procurement: ["Procurement", "Quotes & orders"],
  finance: ["Finance", "Invoice checks"], support: ["Support", "Customer help"],
};
const SYSTEM = {
  hr_db: ["🗂️", "HR database"], vendor_api: ["🏢", "Vendor API"],
  knowledge_base: ["📚", "Knowledge base"], llm: ["🧠", "AI model"],
};
const C = { green: "#22c55e", yellow: "#f59e0b", red: "#ef4444", cyan: "#38bdf8", text: "#e2e8f0",
            dim: "#94a3b8", panel: "rgba(148,163,184,0.06)", line: "rgba(148,163,184,0.18)" };
const STAGE = { DETECT: ["🔎", "Detecting"], MONITOR: ["📋", "Checking everyone"], CORRELATE: ["🔗", "Correlating"],
  DIAGNOSE: ["🧠", "Diagnosing"], TREAT: ["💊", "Treating"], VERIFY: ["✅", "Verifying"], REPORT: ["📝", "Writing report"],
  ESCALATE: ["🙋", "Asking a human"], RESTORE: ["♻️", "Restoring"], IDLE: ["☕", "Making rounds"] };

let logoImg = null;
if (LOGO) { logoImg = new Image(); logoImg.src = LOGO; }

let state = null, online = false;
const doc = { x: HOME[0], y: HOME[1], path: [], target: "home" };
let envelopes = [], rings = [], sparks = [], lastKey = "";

async function poll() {
  try {
    const r = await fetch(API + "/office", { cache: "no-store" });
    const s = await r.json();
    for (const a of s.agents) if (a.new_requests && Math.random() < 0.12 && envelopes.length < 6) spawnEnvelope(a.name);
    const key = s.doctor.stage + s.doctor.message;
    if (key !== lastKey && s.doctor.stage === "VERIFY" && s.doctor.message.startsWith("recovered")) {
      for (const a of s.agents) rings.push({ x: DESKS[a.name][0], y: DESKS[a.name][1], t: 0 });
    }
    lastKey = key;
    state = s; online = true;
    planDoctor();
  } catch (e) { online = false; }
}
setInterval(poll, 500);
poll();

function spawnEnvelope(agent) {
  const [tx, ty] = DESKS[agent];
  envelopes.push({ x: -30, y: 70 + Math.random() * 20, tx: tx - 60, ty: ty - 40, t: 0 });
}

// ---------------------------------------------------------------- doctor path along the corridor
function spot(name) {
  if (DESKS[name]) return [DESKS[name][0], CORRIDOR - 34];
  if (SYSTEMS[name]) return [SYSTEMS[name][0], CORRIDOR + 40];
  return HOME;
}
function planDoctor() {
  const target = (state && state.doctor.target) || "home";
  if (target === doc.target) return;
  doc.target = target;
  const [tx, ty] = target === "home" ? HOME : spot(target);
  doc.path = [[doc.x, CORRIDOR], [tx, CORRIDOR], [tx, ty]];
}
function stepDoctor(dt) {
  let budget = 0.26 * dt;
  while (doc.path.length && budget > 0) {
    const [px, py] = doc.path[0];
    const dx = px - doc.x, dy = py - doc.y, d = Math.hypot(dx, dy);
    if (d <= budget) { doc.x = px; doc.y = py; budget -= d; doc.path.shift(); }
    else { doc.x += dx / d * budget; doc.y += dy / d * budget; budget = 0; }
  }
  return doc.path.length > 0;
}

// ---------------------------------------------------------------- drawing helpers
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function emoji(ch, x, y, size) {
  size *= ICON;
  ctx.font = `${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(ch, x, y);
}
function text(s, x, y, size, color, weight = 600, align = "center") {
  size *= FONT;
  ctx.font = `${weight} ${size}px Inter, -apple-system, "Segoe UI", sans-serif`;
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = "middle"; ctx.fillText(s, x, y);
}
function person(x, y, color, size, mood) {
  // A flat avatar: head + shoulders in the status colour, with a simple face.
  const s = size / 34;
  glow(color, 10);
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, y + 14 * s, 15 * s, Math.PI, 0); ctx.fill();
  ctx.beginPath(); ctx.arc(x, y - 6 * s, 10 * s, 0, Math.PI * 2); ctx.fill();
  noGlow();
  ctx.fillStyle = "#0f172a";
  if (mood === "bad") {
    ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 1.6 * s;
    for (const ex of [-4, 4]) {
      ctx.beginPath(); ctx.moveTo(x + ex * s - 2 * s, y - 9 * s); ctx.lineTo(x + ex * s + 2 * s, y - 5 * s);
      ctx.moveTo(x + ex * s + 2 * s, y - 9 * s); ctx.lineTo(x + ex * s - 2 * s, y - 5 * s); ctx.stroke();
    }
  } else {
    ctx.beginPath(); ctx.arc(x - 3.5 * s, y - 7 * s, 1.5 * s, 0, Math.PI * 2); ctx.arc(x + 3.5 * s, y - 7 * s, 1.5 * s, 0, Math.PI * 2); ctx.fill();
  }
  ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 1.4 * s; ctx.beginPath();
  if (mood === "bad") ctx.arc(x, y + 1 * s, 3 * s, Math.PI * 1.15, Math.PI * 1.85);
  else if (mood === "meh") { ctx.moveTo(x - 3 * s, y - 2 * s); ctx.lineTo(x + 3 * s, y - 2 * s); }
  else ctx.arc(x, y - 4 * s, 3 * s, Math.PI * 0.15, Math.PI * 0.85);
  ctx.stroke();
}
function doctorFigure(x, y) {
  // The doctor: white coat, cyan medical cross.
  glow("rgba(56,189,248,0.9)", 16);
  ctx.fillStyle = "#f8fafc";
  ctx.beginPath(); ctx.arc(x, y + 16, 17, Math.PI, 0); ctx.fill();
  ctx.fillStyle = "#e2e8f0"; ctx.beginPath(); ctx.arc(x, y - 6, 11, 0, Math.PI * 2); ctx.fill();
  noGlow();
  ctx.fillStyle = "#38bdf8"; ctx.fillRect(x - 2, y + 4, 4, 11); ctx.fillRect(x - 5.5, y + 7.5, 11, 4);
  ctx.fillStyle = "#0f172a";
  ctx.beginPath(); ctx.arc(x - 3.5, y - 7, 1.5, 0, Math.PI * 2); ctx.arc(x + 3.5, y - 7, 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(x, y - 4, 3, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
}
function envelope(x, y) {
  glow("rgba(56,189,248,0.8)", 8);
  ctx.fillStyle = "rgba(56,189,248,0.9)"; rr(x - 8, y - 5.5, 16, 11, 2); ctx.fill(); noGlow();
  ctx.strokeStyle = "#0b1220"; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(x - 8, y - 5); ctx.lineTo(x, y + 1); ctx.lineTo(x + 8, y - 5); ctx.stroke();
}
function glow(color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; }
function noGlow() { ctx.shadowBlur = 0; }
function failing(s) { return (s.status !== "up" && s.status !== "primary") || s.integrity !== "ok"; }
function sysColor(s) {
  if (failing(s)) return C.red;
  if (s.status === "backup" || s.fallback || s.breaker === "open") return C.yellow;
  return C.green;
}

// ---------------------------------------------------------------- scene
function drawFloor(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#0d1629"); g.addColorStop(1, "#0a1120");
  ctx.fillStyle = g; rr(0, 0, W, H, 16); ctx.fill();
  ctx.strokeStyle = "rgba(148,163,184,0.05)"; ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 32) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y <= H; y += 32) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.fillStyle = "rgba(56,189,248,0.05)"; ctx.fillRect(0, CORRIDOR - 22, 960, 44);
  ctx.setLineDash([10, 12]); ctx.strokeStyle = "rgba(56,189,248,0.18)";
  ctx.beginPath(); ctx.moveTo(0, CORRIDOR); ctx.lineTo(960, CORRIDOR); ctx.stroke(); ctx.setLineDash([]);
  text("LIVE OFFICE", 22, 26, 12, C.dim, 700, "left");
  text("OPERATIONS FLOOR", 22, 52, 10, "rgba(148,163,184,0.55)", 700, "left");
  text("SHARED SYSTEMS", 22, 372, 10, "rgba(148,163,184,0.55)", 700, "left");
  const live = online ? C.green : C.red;
  ctx.fillStyle = live; ctx.beginPath(); ctx.arc(W - 150, 26, 5 + Math.sin(t / 300), 0, Math.PI * 2); ctx.fill();
  text(online ? "LIVE FEED" : "FEED OFFLINE", W - 138, 26, 11, live, 700, "left");
}

function drawDoctorsOffice() {
  ctx.fillStyle = "rgba(56,189,248,0.06)"; ctx.strokeStyle = "rgba(56,189,248,0.35)"; ctx.lineWidth = 1.5;
  rr(965, 70, 120, 450, 14); ctx.fill(); ctx.stroke();
  text("DOCTOR'S OFFICE", 1025, 90, 10, "#7dd3fc", 700);
  if (logoImg && logoImg.complete && logoImg.naturalWidth) {
    const maxW = 92, maxH = 70, k = Math.min(maxW / logoImg.naturalWidth, maxH / logoImg.naturalHeight);
    const w = logoImg.naturalWidth * k, h = logoImg.naturalHeight * k;
    ctx.drawImage(logoImg, 1025 - w / 2, 150 - h / 2, w, h);
  } else {
    emoji("🩺", 1025, 140, 34); text("AgentMedic", 1025, 175, 13, C.text, 800);
  }
  ctx.fillStyle = "rgba(148,163,184,0.10)"; rr(990, 410, 70, 40, 8); ctx.fill();
  emoji("🖥️", 1025, 430, 22);
}

function pipePoints(a, d) {
  const [ax, ay] = DESKS[a];
  if (SYSTEMS[d]) {
    const [sx, sy] = SYSTEMS[d];
    return [[sx, sy - 40], [sx, CORRIDOR + 30], [ax + (sx - ax) * 0.3, CORRIDOR - 30], [ax, ay + 62]];
  }
  if (DESKS[d]) {
    const [ux, uy] = DESKS[d];
    return [[ux + 90, uy], [ux + 110, uy - 6], [ax - 110, ay - 6], [ax - 90, ay]];
  }
  return null;
}
function bez(p, k) {
  const m = 1 - k;
  return [m * m * m * p[0][0] + 3 * m * m * k * p[1][0] + 3 * m * k * k * p[2][0] + k * k * k * p[3][0],
          m * m * m * p[0][1] + 3 * m * m * k * p[1][1] + 3 * m * k * k * p[2][1] + k * k * k * p[3][1]];
}
function drawPipes(t) {
  if (!state) return;
  const sys = Object.fromEntries(state.services.map(s => [s.name, s]));
  const ag = Object.fromEntries(state.agents.map(a => [a.name, a]));
  let i = 0;
  for (const a of state.agents) for (const d of a.deps) {
    const p = pipePoints(a.name, d); if (!p) continue;
    let color = C.cyan, bad = false;
    if (sys[d]) { bad = failing(sys[d]); color = bad ? C.red : sysColor(sys[d]) === C.yellow ? C.yellow : C.cyan; }
    else if (ag[d]) { bad = ag[d].status === "red"; color = bad ? C.red : C.cyan; }
    ctx.lineWidth = bad ? 3 : 2;
    ctx.strokeStyle = bad ? "rgba(239,68,68,0.55)" : color === C.yellow ? "rgba(245,158,11,0.45)" : "rgba(56,189,248,0.22)";
    ctx.beginPath(); ctx.moveTo(...p[0]); ctx.bezierCurveTo(...p[1], ...p[2], ...p[3]); ctx.stroke();
    const n = bad ? 2 : 3;
    for (let k = 0; k < n; k++) {
      const pos = ((t / (bad ? 2600 : 1600)) + k / n + i * 0.13) % 1;
      const [x, y] = bez(p, pos);
      glow(color, 10); ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(x + (bad ? (Math.random() - 0.5) * 3 : 0), y, bad ? 3 : 2.6, 0, Math.PI * 2); ctx.fill();
      noGlow();
    }
    if (bad && Math.random() < 0.15) { const [x, y] = bez(p, 0.15 + Math.random() * 0.2); sparks.push({ x, y, t: 0 }); }
    i++;
  }
}

function drawSystems(t) {
  if (!state) return;
  for (const s of state.services) {
    const [x, y] = SYSTEMS[s.name]; const col = sysColor(s);
    glow(col, failing(s) ? 18 + 6 * Math.sin(t / 200) : 8);
    ctx.fillStyle = "rgba(15,23,42,0.85)"; ctx.strokeStyle = col; ctx.lineWidth = 1.6;
    rr(x - 92, y - 40, 184, 80, 14); ctx.fill(); ctx.stroke(); noGlow();
    emoji(SYSTEM[s.name][0], x - 60, y, 30);
    text(SYSTEM[s.name][1], x + 14, y - 16, 13, C.text, 700);
    let sub = "online";
    if (failing(s)) sub = s.integrity !== "ok" ? "data corrupted" : s.status;
    else if (s.status === "backup") sub = "running on backup";
    text(sub.toUpperCase(), x + 14, y + 2, 10, col, 700);
    const tags = [];
    if (s.breaker === "open") tags.push("BREAKER OPEN");
    if (s.fallback && s.name !== "llm") tags.push("BACKUP DATA");
    if (tags.length) text(tags.join(" · "), x + 14, y + 20, 9, C.yellow, 700);
  }
}

function drawDesks(t) {
  if (!state) return;
  for (const a of state.agents) {
    const [x, y] = DESKS[a.name]; const col = C[a.status] || C.dim;
    const pulse = a.status === "red" ? 22 + 10 * Math.sin(t / 160) : a.status === "yellow" ? 14 : 10;
    glow(col, pulse);
    ctx.fillStyle = "rgba(15,23,42,0.88)"; ctx.strokeStyle = col; ctx.lineWidth = a.status === "red" ? 2.4 : 1.6;
    rr(x - 92, y - 62, 184, 124, 16); ctx.fill(); ctx.stroke(); noGlow();
    ctx.fillStyle = "rgba(148,163,184,0.10)"; rr(x - 70, y + 22, 140, 14, 6); ctx.fill();
    const bob = a.status === "red" ? Math.sin(t / 80) * 2.2 : Math.sin(t / 700 + x) * 1.2;
    person(x - 52, y - 10 + bob, col, 36, a.status === "red" ? "bad" : a.status === "yellow" ? "meh" : "ok");
    text(AGENT[a.name][0], x + 30, y - 26, 14, C.text, 800);
    text(AGENT[a.name][1], x + 30, y - 7, 10, C.dim, 500);
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x + 76, y - 48, 5, 0, Math.PI * 2); ctx.fill();
    const h = a.health == null ? 1 : a.health;
    ctx.fillStyle = "rgba(148,163,184,0.18)"; rr(x - 70, y + 46, 140, 6, 3); ctx.fill();
    glow(col, 6); ctx.fillStyle = col; rr(x - 70, y + 46, Math.max(5, 140 * h), 6, 3); ctx.fill(); noGlow();
    text(`HEALTH ${(h * 100).toFixed(0)}%`, x + 30, y + 12, 9, col, 700);
    if (a.symptom) {
      // Just the symptom name, e.g. "tool_error_rate on vendor_api" -> "tool error rate".
      const m = a.symptom.split(": ").pop().split(" (")[0].split(" on ")[0].replaceAll("_", " ");
      text("⚠ " + (m.length > 20 ? m.slice(0, 19) + "…" : m), x, y + 76, 9, "#fca5a5", 700);
    }
  }
}

function drawEnvelopes(dt) {
  envelopes = envelopes.filter(e => e.t < 1);
  for (const e of envelopes) {
    e.t += dt / 1300;
    const k = Math.min(1, e.t), ease = k * k * (3 - 2 * k);
    envelope(e.x + (e.tx - e.x) * ease, e.y + (e.ty - e.y) * ease - Math.sin(k * Math.PI) * 18);
  }
}

function drawDoctor(t, dt) {
  const walking = stepDoctor(dt);
  const s = state ? state.doctor : null;
  const working = s && s.working && !walking && doc.target !== "home";
  if (working) {
    const [tx, ty] = DESKS[doc.target] || SYSTEMS[doc.target] || [doc.x, doc.y];
    const a = 0.16 + 0.08 * Math.sin(t / 220);
    const grad = ctx.createLinearGradient(doc.x, doc.y, tx, ty);
    grad.addColorStop(0, `rgba(56,189,248,${a + 0.1})`); grad.addColorStop(1, "rgba(56,189,248,0)");
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.moveTo(doc.x, doc.y - 10); ctx.lineTo(tx - 70, ty); ctx.lineTo(tx + 70, ty); ctx.closePath(); ctx.fill();
  }
  const bob = walking ? Math.abs(Math.sin(t / 85)) * -6 : Math.sin(t / 500) * 1.2;
  ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.beginPath(); ctx.ellipse(doc.x, doc.y + 22, 17, 5, 0, 0, Math.PI * 2); ctx.fill();
  glow("rgba(56,189,248,0.8)", working ? 24 : 12);
  ctx.fillStyle = "rgba(56,189,248,0.10)"; ctx.beginPath(); ctx.arc(doc.x, doc.y + bob, 25, 0, Math.PI * 2); ctx.fill();
  noGlow();
  doctorFigure(doc.x, doc.y + bob);
  let [icon, label] = STAGE[s ? s.stage : "IDLE"] || STAGE.IDLE;
  if (walking && doc.target !== "home") label = "On the way";
  if (state && state.pending_approval) { icon = "✋"; label = "Waiting for your approval"; }
  ctx.font = `700 ${11 * FONT}px Inter, -apple-system, sans-serif`;
  const w = ctx.measureText(label).width + 40;
  const warn = state && state.pending_approval;
  ctx.fillStyle = warn ? "rgba(245,158,11,0.18)" : "rgba(15,23,42,0.92)";
  ctx.strokeStyle = warn ? C.yellow : "rgba(56,189,248,0.6)"; ctx.lineWidth = 1.2;
  rr(doc.x - w / 2, doc.y - 60, w, 26, 13); ctx.fill(); ctx.stroke();
  emoji(icon, doc.x - w / 2 + 15, doc.y - 47, 12);
  text(label, doc.x + 9, doc.y - 47, 11, warn ? "#fde68a" : "#bae6fd", 700);
}

function drawEffects(dt) {
  rings = rings.filter(r => r.t < 1);
  for (const r of rings) {
    r.t += dt / 1500;
    ctx.strokeStyle = `rgba(34,197,94,${1 - r.t})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, 40 + r.t * 70, 0, Math.PI * 2); ctx.stroke();
    if (r.t < 0.6) emoji("✅", r.x + 80, r.y - 60 - r.t * 20, 20);
  }
  sparks = sparks.filter(s => s.t < 1);
  for (const s of sparks) {
    s.t += dt / 500;
    ctx.fillStyle = `rgba(252,165,165,${1 - s.t})`;
    ctx.beginPath(); ctx.arc(s.x + (Math.random() - 0.5) * 10 * s.t, s.y - 12 * s.t, 2, 0, Math.PI * 2); ctx.fill();
  }
}

let prev = performance.now();
function frame(now) {
  const dt = Math.min(64, now - prev); prev = now;
  drawFloor(now);
  drawDoctorsOffice();
  drawPipes(now);
  drawSystems(now);
  drawDesks(now);
  drawEnvelopes(dt);
  drawEffects(dt);
  drawDoctor(now, dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
