<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- Step images for the hackathon page (600x600). Choose the step with ?n=1, ?n=2 or ?n=3. -->
<style>
  html, body { margin:0; width:600px; height:600px; overflow:hidden; background:#0f1b2d; }
  .card { position:absolute; inset:0; background:radial-gradient(circle at 50% 42%, #16314a 0%, #0f1b2d 62%);
          display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:Inter,-apple-system,"Segoe UI",sans-serif; }
  .dots { position:absolute; inset:0; background-image:radial-gradient(rgba(148,163,184,.10) 1.4px, transparent 1.4px);
          background-size:30px 30px; }
  .ring { position:relative; width:330px; height:330px; border-radius:50%; display:flex; align-items:center; justify-content:center;
          background:radial-gradient(circle, rgba(45,212,191,.16) 0%, rgba(45,212,191,.04) 62%, transparent 70%);
          box-shadow:0 0 0 2px rgba(45,212,191,.28) inset; }
  svg.icon { width:190px; height:190px; color:#2dd4bf; filter:drop-shadow(0 0 18px rgba(45,212,191,.55)); }
  .badge { position:absolute; right:38px; bottom:38px; width:96px; height:96px; border-radius:28px; background:#0f1b2d;
           border:3px solid #2dd4bf; display:flex; align-items:center; justify-content:center;
           box-shadow:0 0 24px rgba(45,212,191,.45); }
  .badge svg { width:56px; height:56px; color:#2dd4bf; }
  .label { position:relative; margin-top:44px; color:#e2e8f0; font-size:34px; font-weight:800; letter-spacing:.06em; }
  .label span { color:#2dd4bf; }
</style>
</head>
<body>
<div class="card"><div class="dots"></div><div class="ring" id="ring"></div><div class="label" id="label"></div></div>
<script>
  const s = 'xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"';
  const STEPS = {
    1: { label: 'WATCH <span>&amp;</span> DETECT',
         icon: `<svg class="icon" ${s} stroke-width="1.6"><circle cx="10.5" cy="10.5" r="7.5"/><path d="m21 21-5.2-5.2"/>
                <path d="M5.2 10.8h2.2l1.5-3.2 2.2 6.2 1.6-3h2.2"/></svg>`, badge: '' },
    2: { label: 'DIAGNOSE <span>&amp;</span> FIX',
         icon: `<svg class="icon" ${s} stroke-width="1.6"><path d="M11 2v2M5 2v2M5 3H4a2 2 0 0 0-2 2v4a6 6 0 0 0 12 0V5a2 2 0 0 0-2-2h-1"/>
                <path d="M8 15a6 6 0 0 0 12 0v-3"/><circle cx="20" cy="10" r="2"/></svg>`,
         badge: `<svg ${s} stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>` },
    3: { label: 'VERIFY <span>&amp;</span> REPORT',
         icon: `<svg class="icon" ${s} stroke-width="1.6"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/>
                <path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="m8.5 14.5 2.5 2.5 4.5-5"/></svg>`, badge: '' },
  };
  const n = new URLSearchParams(location.search).get('n') || '1';
  const st = STEPS[n];
  document.getElementById('ring').innerHTML = st.icon + (st.badge ? `<div class="badge">${st.badge}</div>` : '');
  document.getElementById('label').innerHTML = st.label;
</script>
</body>
</html>
